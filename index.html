<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광주광역시 복지 지원사업 현황</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 1.1em;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #e3f2fd;
            transform: scale(1.01);
            transition: all 0.2s ease;
        }

        .institution {
            font-weight: 600;
            color: #2c3e50;
            min-width: 150px;
        }

        .program {
            font-weight: 500;
            color: #27ae60;
            min-width: 200px;
        }

        .content-cell {
            line-height: 1.6;
            color: #555;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
            font-size: 1.1em;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin: 20px auto;
            display: block;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .stats {
                flex-direction: column;
                align-items: center;
            }
            
            table {
                font-size: 0.9em;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ 광주광역시 복지 지원사업</h1>
            <p>시민을 위한 다양한 복지 혜택을 한눈에 확인하세요</p>
        </div>

        <div class="content">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="total-programs">-</div>
                    <div class="stat-label">총 지원사업</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="total-institutions">-</div>
                    <div class="stat-label">참여기관</div>
                </div>
            </div>

            <button class="refresh-btn" onclick="loadWelfareData()">📊 데이터 새로고침</button>

            <div class="table-container">
                <div id="loading" class="loading">
                    🔄 복지 지원사업 데이터를 불러오는 중...
                </div>
                <div id="error" class="error" style="display: none;">
                    ❌ 데이터를 불러오는데 실패했습니다.
                </div>
                <table id="welfare-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>🏢 기관명</th>
                            <th>📋 지원사업명</th>
                            <th>💡 지원내용</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            <p>📅 최종 업데이트: <span id="last-update">-</span></p>
            <p>📍 출처: 광주광역시 홈페이지</p>
        </div>
    </div>

    <script>
        // 복지 데이터를 불러오는 함수
        async function loadWelfareData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const table = document.getElementById('welfare-table');
            
            // 로딩 상태 표시
            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';

            try {
                // JSON 파일에서 데이터 로드
                const response = await fetch('welfare_data.json');
                
                if (!response.ok) {
                    throw new Error('데이터 파일을 찾을 수 없습니다.');
                }
                
                const welfareData = await response.json();
                
                if (!welfareData || welfareData.length === 0) {
                    throw new Error('복지 데이터가 비어있습니다.');
                }

                displayWelfareData(welfareData);
                
            } catch (err) {
                console.error('데이터 로드 오류:', err);
                
                // 오류 발생 시 샘플 데이터 사용
                const sampleData = [
                    {
                        '기관명': '광주광역시 보건소',
                        '지원사업명': '난임부부 지원사업',
                        '지원내용': '난임시술비 지원 - 체외수정(신선배아, 동결배아) 최대 20회, 인공수정 최대 5회 지원. 만 44세 이하 신선배아 최대 110만원, 동결배아 최대 50만원 지원'
                    },
                    {
                        '기관명': '광주광역시 사회복지과',
                        '지원사업명': '저소득층 생계급여',
                        '지원내용': '기준 중위소득 30% 이하 가구에 대해 생계급여 지원. 1인 가구 기준 월 623,368원 지원'
                    },
                    {
                        '기관명': '광주광역시 아동복지과',
                        '지원사업명': '아동수당',
                        '지원내용': '만 8세 미만 모든 아동에게 월 10만원 지원. 소득수준에 관계없이 지원'
                    },
                    {
                        '기관명': '광주광역시 노인복지과',
                        '지원사업명': '기초연금',
                        '지원내용': '만 65세 이상 소득 하위 70% 어르신에게 월 최대 334,810원 지원'
                    },
                    {
                        '기관명': '광주광역시 장애인복지과',
                        '지원사업명': '장애인연금',
                        '지원내용': '중증장애인(1~3급)에게 기초급여 월 334,810원과 부가급여 월 최대 80,000원 지원'
                    }
                ];
                
                displayWelfareData(sampleData);
            }
        }

        // 데이터를 테이블에 표시하는 함수
        function displayWelfareData(data) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const table = document.getElementById('welfare-table');
            const tableBody = document.getElementById('table-body');
            
            // 로딩 숨기기, 테이블 표시
            loading.style.display = 'none';
            error.style.display = 'none';
            table.style.display = 'table';
            
            // 기존 테이블 내용 삭제
            tableBody.innerHTML = '';
            
            // 데이터를 테이블에 추가
            data.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="institution">${item['기관명'] || '-'}</td>
                    <td class="program">${item['지원사업명'] || '-'}</td>
                    <td class="content-cell">${item['지원내용'] || '-'}</td>
                `;
                tableBody.appendChild(row);
            });
            
            // 통계 업데이트
            updateStats(data);
            
            // 마지막 업데이트 시간 표시
            const now = new Date();
            document.getElementById('last-update').textContent = 
                now.toLocaleString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
        }

        // 통계 정보 업데이트
        function updateStats(data) {
            const totalPrograms = data.length;
            const institutions = new Set(data.map(item => item['기관명']));
            const totalInstitutions = institutions.size;
            
            document.getElementById('total-programs').textContent = totalPrograms;
            document.getElementById('total-institutions').textContent = totalInstitutions;
        }

        // 페이지 로드 시 데이터 불러오기
        document.addEventListener('DOMContentLoaded', function() {
            loadWelfareData();
        });
    </script>
</body>
</html>
